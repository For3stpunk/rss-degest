name: Merge RSS feeds

# Runs every hour, and lets you trigger it manually from the Actions tab
on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}    # adds a "Run workflow" button in the GitHub UI

permissions:
  contents: write          # needed so the workflow can commit combined.html / combined.xml back to the repo

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the merge script
        run: python merge_feeds.py

      - name: Commit the updated combined files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add combined.html combined.xml
          git diff --quiet --staged || git commit -m "Update combined feed"
          git push
